[package]
name = "agentpocket"
version = "2.17.0"
edition = "2021"

[dependencies]
agentpocket-core = { path = "../core" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
uuid = { version = "1", features = ["v4"] }
semver = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
